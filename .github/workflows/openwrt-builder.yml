name: OpenWrt Builder for TP-Link Archer C7 v2 (Optimized)

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build'
        required: false
        default: 'false'
      enable_ccache:
        description: 'Enable CCache for faster rebuild'
        required: false
        default: 'true'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  SSH_ACTIONS: true
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check system resources
      run: |
        echo "=== 系统资源信息 ==="
        echo "磁盘空间:"
        df -h
        echo "内存信息:"
        free -h
        echo "CPU 信息:"
        nproc
        cat /proc/cpuinfo | grep "model name" | head -2

    - name: Setup 8GB swap file
      run: |
        echo "=== 设置 8GB Swap 文件 ==="
        
        # 检查当前 Swap
        echo "当前 Swap 信息:"
        swapon --show
        
        # 创建 8GB Swap 文件
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        
        # 验证 Swap
        echo "Swap 设置完成:"
        free -h
        swapon --show
        
        # 设置 swappiness 优化编译性能
        echo "vm.swappiness = 10" | sudo tee -a /etc/sysctl.conf
        sudo sysctl -p

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "=== 初始化环境 ==="
        
        # 清理不需要的系统文件
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo apt-get clean
        sudo docker system prune -af
        
        # 更新和安装编译依赖
        sudo apt-get update -y
        sudo apt-get install -y \
          build-essential \
          ccache \
          cmake \
          cpio \
          curl \
          flex \
          g++ \
          gawk \
          gcc \
          gettext \
          git \
          jq \
          libncurses5-dev \
          libncursesw5-dev \
          libssl-dev \
          make \
          patch \
          python3 \
          python3-pip \
          python3-setuptools \
          rsync \
          subversion \
          tar \
          unzip \
          wget \
          xsltproc \
          xxd \
          zip \
          zlib1g-dev
        
        # 安装额外工具
        sudo apt-get install -y \
          automake \
          autoconf \
          autopoint \
          bison \
          fakeroot \
          gperf \
          help2man \
          libtool \
          pkg-config \
          texinfo
        
        # 清理缓存
        sudo apt-get autoremove -y
        sudo rm -rf /var/lib/apt/lists/*
        
        # 设置时区
        sudo timedatectl set-timezone "$TZ"
        
        # 创建编译目录
        sudo mkdir -p /workdir
        sudo chown -R $USER:$GROUPS /workdir
        
        # 设置 CCache 环境（如果启用）
        if [ "${{ github.event.inputs.enable_ccache }}" = "true" ]; then
          echo "CCACHE_DIR=/workdir/ccache" >> $GITHUB_ENV
          mkdir -p /workdir/ccache
          echo "CCache 已启用，目录: /workdir/ccache"
        fi

    - name: Clone source code
      working-directory: /workdir
      run: |
        echo "=== 克隆源码 ==="
        
        # 清理旧源码（如果选择了 clean build）
        if [ "${{ github.event.inputs.clean_build }}" = "true" ] && [ -d "openwrt" ]; then
          echo "清理旧源码..."
          rm -rf openwrt
        fi
        
        # 克隆源码
        if [ ! -d "openwrt" ]; then
          echo "开始克隆 OpenWrt 源码..."
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        else
          echo "源码已存在，更新..."
          cd openwrt
          git pull
          cd ..
        fi
        
        # 创建软链接
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        
        echo "源码大小: $(du -sh openwrt)"

    - name: Load custom feeds
      run: |
        echo "=== 加载自定义 feeds ==="
        
        # 复制 feeds 配置文件
        if [ -f "$FEEDS_CONF" ]; then
          echo "使用自定义 feeds 配置"
          cp "$FEEDS_CONF" openwrt/feeds.conf.default
        fi
        
        # 执行自定义脚本
        if [ -f "$DIY_P1_SH" ]; then
          chmod +x "$DIY_P1_SH"
          cd openwrt
          ../"$DIY_P1_SH"
        fi

    - name: Update feeds
      run: |
        echo "=== 更新 feeds ==="
        cd openwrt
        ./scripts/feeds update -a

    - name: Install feeds
      run: |
        echo "=== 安装 feeds ==="
        cd openwrt
        ./scripts/feeds install -a

    - name: Apply configuration
      run: |
        echo "=== 应用配置 ==="
        
        # 复制配置文件
        if [ -f "$CONFIG_FILE" ]; then
          echo "使用自定义 .config 文件"
          cp "$CONFIG_FILE" openwrt/.config
        fi
        
        # 执行自定义脚本
        if [ -f "$DIY_P2_SH" ]; then
          chmod +x "$DIY_P2_SH"
          cd openwrt
          ../"$DIY_P2_SH"
        fi

    - name: Download packages
      run: |
        echo "=== 下载软件包 ==="
        cd openwrt
        
        # 应用配置
        make defconfig
        
        # 下载依赖包
        echo "开始下载软件包..."
        time make download -j$(nproc) || make download -j1
        
        # 检查下载结果
        echo "下载完成，统计:"
        find dl -type f | wc -l
        du -sh dl

    - name: Monitor compile resources
      run: |
        echo "=== 编译资源监控开始 ==="
        # 后台运行资源监控
        while true; do
          echo "---- $(date +%H:%M:%S) ----"
          echo "内存使用:"
          free -h | grep -E "Mem|Swap"
          echo "磁盘空间:"
          df -h | grep "/dev/root"
          echo "CPU 使用率:"
          top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\)%* id.*/\1/" | awk '{print "CPU空闲率: " 100-$1 "%"}'
          echo "CCache 状态:"
          ccache -s 2>/dev/null || echo "CCache 未启用"
          echo "--------------------------------"
          sleep 60
        done &
        MONITOR_PID=$!
        echo "监控进程 PID: $MONITOR_PID"
        echo "MONITOR_PID=$MONITOR_PID" >> $GITHUB_ENV

    - name: Compile firmware
      run: |
        echo "=== 开始编译固件 ==="
        cd openwrt
        
        # 设置编译环境
        export FORCE_UNSAFE_CONFIGURE=1
        
        # 设置 CCache（如果启用）
        if [ "${{ github.event.inputs.enable_ccache }}" = "true" ]; then
          export CCACHE_DIR=/workdir/ccache
          export CCACHE_MAXSIZE=5G
          ccache -o compression=true
          ccache -o max_size=5G
          echo "CCache 配置:"
          ccache -s
        fi
        
        # 显示配置信息
        echo "编译配置摘要:"
        grep -E "CONFIG_TARGET|CONFIG_PACKAGE_luci|CONFIG_PACKAGE_kmod-ath" .config | head -20
        
        # 开始编译
        echo "使用单线程编译 (make -j1 V=s)..."
        time make -j1 V=s 2>&1 | tee compile.log
        
        # 检查编译结果
        if [ ${PIPESTATUS[0]} -eq 0 ]; then
          echo "✅ 编译成功"
          echo "COMPILE_STATUS=success" >> $GITHUB_ENV
        else
          echo "❌ 编译失败"
          echo "COMPILE_STATUS=failed" >> $GITHUB_ENV
          
          # 输出错误信息
          echo "最后100行错误日志:"
          tail -100 compile.log | grep -i -A5 -B5 "error\|failed\|undefined"
          
          exit 1
        fi

    - name: Stop resource monitor
      if: always()
      run: |
        echo "=== 停止资源监控 ==="
        if [ -n "$MONITOR_PID" ]; then
          kill $MONITOR_PID 2>/dev/null || true
          echo "资源监控已停止"
        fi

    - name: Check firmware output
      if: env.COMPILE_STATUS == 'success'
      run: |
        echo "=== 检查固件输出 ==="
        cd openwrt
        
        # 查找固件目录
        if [ -d "bin/targets" ]; then
          echo "找到固件目录结构:"
          find bin/targets -type d | sort
          
          # 进入 ath79/generic 目录
          if [ -d "bin/targets/ath79/generic" ]; then
            cd bin/targets/ath79/generic
            
            # 查找 Archer C7 v2 固件
            echo "查找 Archer C7 v2 固件:"
            find . -name "*archer-c7*" -o -name "*archer_c7*" | while read f; do
              echo "- $f ($(du -h "$f" | cut -f1))"
            done
            
            # 检查 sysupgrade 固件
            SYS_FIRMWARE=$(find . -name "*sysupgrade*.bin" | head -1)
            if [ -n "$SYS_FIRMWARE" ]; then
              echo "找到 sysupgrade 固件: $SYS_FIRMWARE"
              SIZE_KB=$(du -k "$SYS_FIRMWARE" | cut -f1)
              SIZE_MB=$(echo "scale=2; $SIZE_KB/1024" | bc)
              echo "固件大小: ${SIZE_MB}MB (${SIZE_KB}KB)"
              
              # 检查是否超过 16MB 限制
              if [ $SIZE_KB -gt 16384 ]; then
                echo "⚠️ 警告: 固件大小超过 16MB 限制，可能无法刷入"
              else
                echo "✅ 固件大小在 16MB 限制内"
              fi
              
              # 设置固件目录环境变量
              echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV
            else
              echo "未找到 sysupgrade 固件"
            fi
            
            # 生成文件列表
            echo "生成文件列表..."
            ls -la > filelist.txt
            echo "文件列表:"
            cat filelist.txt
          else
            echo "未找到 ath79/generic 目录"
          fi
        else
          echo "未找到 bin/targets 目录"
        fi

    - name: Upload bin directory
      if: env.COMPILE_STATUS == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_Bin_$(date +%Y%m%d_%H%M)
        path: openwrt/bin
        retention-days: 7

    - name: Upload firmware artifacts
      if: env.COMPILE_STATUS == 'success' && env.UPLOAD_FIRMWARE == 'true' && env.FIRMWARE_DIR != ''
      uses: actions/upload-artifact@v4
      with:
        name: Archer_C7_v2_Firmware_$(date +%Y%m%d_%H%M)
        path: ${{ env.FIRMWARE_DIR }}
        retention-days: 7

    - name: Create release
      if: env.COMPILE_STATUS == 'success' && env.UPLOAD_RELEASE == 'true' && env.FIRMWARE_DIR != ''
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "=== 创建 Release ==="
        
        # 生成版本标签
        RELEASE_TAG="v$(date +%Y.%m.%d.%H%M)"
        
        # 创建 release 说明
        cat > release_notes.md << EOF
        # OpenWrt for TP-Link Archer C7 v2
        
        ## 固件信息
        - 编译时间: $(date)
        - 源码仓库: $REPO_URL
        - 源码分支: $REPO_BRANCH
        - 目标设备: TP-Link Archer C7 v2 (16MB)
        
        ## 刷机说明
        1. 下载固件文件
        2. 登录原厂固件管理界面
        3. 选择固件升级
        4. 上传 \`*-sysupgrade.bin\` 文件
        5. 等待刷机完成自动重启
        
        ## 默认设置
        - IP 地址: 192.168.1.1
        - 用户名: root
        - 密码: password
        
        ## 文件列表
        \`\`\`
        $(cd $FIRMWARE_DIR && ls -la)
        \`\`\`
        EOF
        
        # 创建 Release
        gh release create $RELEASE_TAG \
          --title "OpenWrt for Archer C7 v2 ($(date +%Y-%m-%d))" \
          --notes-file release_notes.md \
          ${{ env.FIRMWARE_DIR }}/*.bin \
          ${{ env.FIRMWARE_DIR }}/*.img \
          ${{ env.FIRMWARE_DIR }}/*.gz

    - name: Clean up
      if: always()
      run: |
        echo "=== 清理工作空间 ==="
        
        # 删除 Swap 文件
        sudo swapoff /swapfile 2>/dev/null || true
        sudo rm -f /swapfile 2>/dev/null || true
        
        # 清理编译缓存（保留 CCache）
        if [ -d "/workdir/openwrt" ]; then
          cd /workdir/openwrt
          make clean 2>/dev/null || true
          rm -rf tmp build_dir/* staging_dir/* logs 2>/dev/null || true
        fi
        
        # 显示最终磁盘使用情况
        echo "最终磁盘空间:"
        df -h
        
        echo "CCache 统计（如果启用）:"
        ccache -s 2>/dev/null || echo "CCache 未启用"

    - name: Generate build report
      if: always()
      run: |
        echo "=== 编译报告 ===" > build_report.md
        echo "## OpenWrt 编译报告" >> build_report.md
        echo "- 编译时间: $(date)" >> build_report.md
        echo "- 设备: TP-Link Archer C7 v2 (16MB)" >> build_report.md
        echo "- 编译状态: ${{ env.COMPILE_STATUS || 'unknown' }}" >> build_report.md
        echo "- 源码: $REPO_URL ($REPO_BRANCH)" >> build_report.md
        
        if [ "${{ env.COMPILE_STATUS }}" = "success" ]; then
          echo "## 固件信息" >> build_report.md
          echo "- 固件目录: ${{ env.FIRMWARE_DIR || '未找到' }}" >> build_report.md
          echo "- 上传时间: $(date +%H:%M:%S)" >> build_report.md
        else
          echo "## 编译失败" >> build_report.md
          echo "请查看编译日志获取详细信息" >> build_report.md
        fi
        
        echo "## 资源使用" >> build_report.md
        echo "编译过程中资源使用情况已记录在监控日志中" >> build_report.md
        
        # 输出报告
        cat build_report.md