name: OpenWrt Builder for TP-Link Archer C7 v2 (Fixed)

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build'
        required: false
        default: 'false'
      compile_threads:
        description: 'Compile threads (1-4)'
        required: false
        default: '4'
      ccache_size:
        description: 'CCache size (GB)'
        required: false
        default: '20'

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
