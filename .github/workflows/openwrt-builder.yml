  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Display system info
      run: |
        echo "=== 系统资源信息 ==="
        echo "CPU 信息:"
        cat /proc/cpuinfo | grep -E "processor|model name|cpu cores" | head -6
        echo "内存信息:"
        free -h
        echo "磁盘空间:"
        df -h
        echo "系统版本:"
        lsb_release -a

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "=== 初始化环境 ==="
        
        # 清理不需要的文件
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo apt-get clean
        
        # 更新并安装必要工具
        sudo apt-get update -y
        sudo apt-get install -y \
          build-essential \
          ccache \
          cmake \
          cpio \
          curl \
          flex \
          g++ \
          gawk \
          gcc \
          gettext \
          git \
          libncurses5-dev \
          libncursesw5-dev \
          libssl-dev \
          make \
          patch \
          python3 \
          python3-pip \
          python3-setuptools \
          rsync \
          subversion \
          tar \
          unzip \
          wget \
          xsltproc \
          xxd \
          zip \
          zlib1g-dev
        
        # 设置时区
        sudo timedatectl set-timezone "$TZ"
        
        echo "环境初始化完成"

    - name: Setup CCache
      run: |
        echo "=== 设置 CCache 缓存 ==="
        
        # 设置 CCache 大小，修复语法错误
        if [ -n "${{ github.event.inputs.ccache_size }}" ]; then
          CCACHE_SIZE="${{ github.event.inputs.ccache_size }}G"
        else
          CCACHE_SIZE="20G"
        fi
        
        echo "CCache 大小: $CCACHE_SIZE"
        
        # 配置 CCache
        ccache --set-config=max_size=$CCACHE_SIZE
        ccache --set-config=compression=true
        ccache --set-config=compression_level=1
        ccache --set-config=sloppiness=file_macro,include_file_ctime,include_file_mtime
        
        # 显示 CCache 配置
        echo "CCache 配置:"
        ccache -p
        ccache -z  # 重置统计

    - name: Clone source code
      run: |
        echo "=== 克隆源码 ==="
        
        # 清理旧源码
        if [ "${{ github.event.inputs.clean_build }}" = "true" ] && [ -d "openwrt" ]; then
          echo "清理旧源码..."
          rm -rf openwrt
        fi
        
        # 克隆源码
        if [ ! -d "openwrt" ]; then
          echo "开始克隆 OpenWrt 源码..."
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        else
          echo "源码已存在，更新..."
          cd openwrt
          git pull
          cd ..
        fi
        
        echo "源码大小: $(du -sh openwrt)"

    - name: Load custom feeds
      run: |
        echo "=== 加载自定义 feeds ==="
        
        # 复制 feeds 配置文件
        if [ -f "$FEEDS_CONF" ]; then
          echo "使用自定义 feeds 配置"
          cp "$FEEDS_CONF" openwrt/feeds.conf.default
        fi
        
        # 执行自定义脚本
        if [ -f "$DIY_P1_SH" ]; then
          chmod +x "$DIY_P1_SH"
          cd openwrt
          ../"$DIY_P1_SH"
        fi

    - name: Update feeds
      run: |
        echo "=== 更新 feeds ==="
        cd openwrt
        ./scripts/feeds update -a

    - name: Install feeds
      run: |
        echo "=== 安装 feeds ==="
        cd openwrt
        ./scripts/feeds install -a

    - name: Apply configuration
      run: |
        echo "=== 应用配置 ==="
        
        # 复制配置文件
        if [ -f "$CONFIG_FILE" ]; then
          echo "使用自定义 .config 文件"
          cp "$CONFIG_FILE" openwrt/.config
        fi
        
        # 执行自定义脚本
        if [ -f "$DIY_P2_SH" ]; then
          chmod +x "$DIY_P2_SH"
          cd openwrt
          ../"$DIY_P2_SH"
        fi

    - name: Download packages
      run: |
        echo "=== 下载软件包 ==="
        cd openwrt
        
        # 应用配置
        make defconfig
        
        # 显示关键配置
        echo "关键配置:"
        grep -E "CONFIG_TARGET_ath79|CONFIG_TARGET_ath79_generic_DEVICE_tplink_archer-c7-v2" .config
        
        # 下载依赖包
        echo "开始下载软件包..."
        make download -j$(nproc) || make download -j1
        
        echo "下载完成"

    - name: Compile firmware
      run: |
        echo "=== 开始编译固件 ==="
        cd openwrt
        
        # 设置编译环境
        export FORCE_UNSAFE_CONFIGURE=1
        
        # 显示编译前 CCache 状态
        echo "编译前 CCache 状态:"
        ccache -s
        
        # 确定编译线程数
        if [ -n "${{ github.event.inputs.compile_threads }}" ]; then
          COMPILE_JOBS="${{ github.event.inputs.compile_threads }}"
        else
          COMPILE_JOBS=4
        fi
        
        echo "使用 $COMPILE_JOBS 线程编译"
        
        # 开始编译
        echo "开始编译 (make -j$COMPILE_JOBS V=s)..."
        START_TIME=$(date +%s)
        
        # 执行编译
        if make -j$COMPILE_JOBS V=s 2>&1 | tee compile.log; then
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "✅ 编译成功"
          echo "编译耗时: $((DURATION / 60))分$((DURATION % 60))秒"
          echo "COMPILE_STATUS=success" >> $GITHUB_ENV
          
          # 显示 CCache 命中率
          echo "编译后 CCache 状态:"
          ccache -s
        else
          echo "❌ 编译失败"
          echo "COMPILE_STATUS=failed" >> $GITHUB_ENV
          
          # 输出错误信息
          echo "最后50行错误日志:"
          tail -50 compile.log | grep -i -A3 -B3 "error\|failed\|undefined"
          
          exit 1
        fi

    - name: Check firmware output
      if: env.COMPILE_STATUS == 'success'
      run: |
        echo "=== 检查固件输出 ==="
        cd openwrt
        
        # 查找固件
        echo "查找固件文件..."
        find bin -name "*.bin" -o -name "*.img" -o -name "*.gz" | head -20
        
        # 查找 Archer C7 v2 固件
        ARCHER_FILES=$(find bin -name "*archer-c7*" -o -name "*archer_c7*" -o -name "*c7*" 2>/dev/null)
        
        if [ -n "$ARCHER_FILES" ]; then
          echo "找到 Archer C7 v2 固件:"
          echo "$ARCHER_FILES"
          
          # 设置固件目录
          FIRMWARE_DIR=$(dirname "$(echo "$ARCHER_FILES" | head -1)")
          echo "FIRMWARE_DIR=$FIRMWARE_DIR" >> $GITHUB_ENV
          
          # 检查固件大小
          cd "$FIRMWARE_DIR"
          echo "固件目录: $PWD"
          ls -lh
        else
          echo "未找到 Archer C7 固件，列出所有固件:"
          find bin -type f \( -name "*.bin" -o -name "*.img" \) | head -10
        fi

    - name: Upload firmware artifacts
      if: env.COMPILE_STATUS == 'success' && env.FIRMWARE_DIR != ''
      uses: actions/upload-artifact@v4
      with:
        name: Archer_C7_v2_Firmware_$(date +%Y%m%d_%H%M)
        path: ${{ env.FIRMWARE_DIR }}
        retention-days: 7

    - name: Generate build report
      if: always()
      run: |
        echo "=== 编译报告 ==="
        echo "编译状态: ${{ env.COMPILE_STATUS || 'unknown' }}"
        echo "固件目录: ${{ env.FIRMWARE_DIR || '未找到' }}"
        echo "CCache 状态:"
        ccache -s
        
        if [ "${{ env.COMPILE_STATUS }}" = "success" ]; then
          echo "✅ 编译成功完成"
        else
          echo "❌ 编译失败"
        fi